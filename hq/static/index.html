<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Farm HQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/design.css">
<link rel="stylesheet" href="/static/work.css">
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="brand">
      <div class="brand-icon">🌾</div>
      <div>
        <div class="brand-name">Tiny Farm HQ</div>
        <div class="brand-sub">CEO Operating Surface</div>
      </div>
    </div>
    <div class="nav-group" data-grp="dashboard">
      <div class="nav-parent">
        <a href="#/" data-route="/"><span>🏠</span> Dashboard</a>
        <button class="nav-caret" data-grp="dashboard" aria-label="expand quiet pillars">▸</button>
      </div>
      <!-- Exception pillars (fire/attention) never fold: unblocking is the job. -->
      <div class="nav-sub nav-exc" id="nav-pillars-exc"></div>
      <div class="nav-sub" id="nav-pillars" hidden></div>
    </div>
    <a href="#/org" data-route="/org"><span>🧑‍🤝‍🧑</span> Org Chart</a>
    <div class="nav-group" data-grp="program">
      <div class="nav-parent">
        <a href="#/program" data-route="/program"><span>🗂️</span> Program Report</a>
        <button class="nav-caret" data-grp="program" aria-label="expand program pages">▸</button>
      </div>
      <div class="nav-sub" hidden>
        <a href="#/program/goals" data-route="/program/goals"><span>🎯</span> Goals</a>
      </div>
    </div>
    <a href="#/playtests" data-route="/playtests"><span>🧪</span> Playtests</a>
    <div class="nav-group" data-grp="design">
      <div class="nav-parent">
        <a href="#/design" data-route="/design"><span>🎨</span> Design Studio</a>
        <button class="nav-caret" data-grp="design" aria-label="expand design tools">▸</button>
      </div>
      <!-- The design tools: pages where an artifact of the game is worked on
           directly — sprites, maps — as opposed to pages that report on it. -->
      <div class="nav-sub" hidden>
        <a href="#/design/gdd" data-route="/design/gdd"><span>📖</span> Game Design Doc</a>
        <a href="#/entities" data-route="/entities"><span>🐔</span> Entities</a>
        <a href="#/maps" data-route="/maps"><span>🗺️</span> Map Editor</a>
        <a href="#/design/anim" data-route="/design/anim"><span>🌻</span> Animation Lab</a>
      </div>
    </div>
    <a href="#/work" data-route="/work"><span>🧾</span> Your Queue <b id="work-badge" class="badge" hidden></b></a>
    <a href="#/chat" data-route="/chat"><span>💬</span> Chief of Staff</a>
    <div class="sidebar-foot">
      <div class="nav-legend">
        <span><i class="dot d-ok"></i>under control</span>
        <span><i class="dot d-attn"></i>needs attention</span>
        <span><i class="dot d-fire"></i>on fire</span>
        <span><i class="dot d-unchecked"></i>monitoring gaps</span>
        <span><i class="dot d-dorm"></i>dormant</span>
      </div>
      <div id="health-dot" class="health"><i></i> checking…</div>
    </div>
  </nav>
  <main id="view"></main>
</div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/surface.js"></script>
<script src="/static/sprite.js"></script>
<script src="/static/map.js"></script>
<script src="/static/pillars.js"></script>
<script src="/static/playtests.js"></script>
<script src="/static/app.js"></script>
<script src="/static/product.js"></script>
<script src="/static/goals.js"></script>
<script src="/static/design.js"></script>
<script src="/static/anim.js"></script>
<script src="/static/work.js"></script>
</body>
</html>
