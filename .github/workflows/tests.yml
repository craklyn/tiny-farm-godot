name: tests

on:
  push:
  pull_request:
  # Callable, so release.yml gates publishing on the same suite rather than a
  # duplicated copy of it that can drift.
  workflow_call:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  # Every world change goes through SimWorld.apply_action (S-3), and until this
  # job existed nothing checked it. A renderer that wrote into the grid directly
  # compiled, passed the unit suite, passed the integration suite, and quietly
  # corrupted every replay recorded from then on — recordings that are phase 4's
  # training data, so the break would have surfaced when bot training failed on
  # the corpus. It reads the code rather than running it, needs no engine, and
  # finishes in about a second, so it is a job of its own rather than a step
  # behind the Godot download.
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # First the check proves itself against deliberately planted violations,
      # then it runs for real. A checker nobody has watched fail is only a claim
      # that the rule holds.
      - name: The check catches a planted violation
        run: python3 tools/check_gateway.py --self-test

      - name: One gateway for every world change
        run: python3 tools/check_gateway.py

  writing:
    # The same shape as the gateway check, for the same reason. "No house
    # vocabulary on a surface a human reads" has been a written rule since
    # 2026-09-03 and kept being broken, because it depended on somebody
    # noticing — and the person who notices is the CEO, which is the friction
    # the rule exists to remove.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The judgement pass needs a model, and CI is the wrong place for one: a
      # shared runner would pay for it on every push and could disagree with
      # itself between two identical commits. So CI reads the verdicts already
      # recorded in docs/writing_verdicts.json — offline, deterministic, and it
      # fails when text has changed without being read, never because a model
      # was in a different mood. The judging itself happens at commit time (the
      # commit-msg hook) and behind HQ's Run button.
      - name: Every surface he reads has been read, and passed
        run: python3 tools/check_writing.py --verify

      # Discover every focused HQ regression. Each file gets its own scratch
      # directory; unknown files, skips, timeouts and non-zero exits fail.
      # The work queue refuses to publish anything gitleaks has not checked, and
      # its tests exercise that on the real tool: the same pinned build as the
      # secrets job, on PATH, because a skipped test fails this runner.
      - name: Install gitleaks 8.30.1 for the publishing tests
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Every HQ process regression
        run: python3 hq/run_tests.py

      # HQ's front-end files are plain scripts sharing one global scope, so the
      # same name in two of them is a SyntaxError that blanks every page — and
      # each file passes a per-file syntax check on its own, which is how one
      # got shipped.
      - name: The check catches a planted name clash
        run: python3 tools/check_frontend.py --self-test

      - name: No name declared twice across HQ's front-end
        run: python3 tools/check_frontend.py

      - name: Animation Lab launches and verdicts preserve their work record
        run: python3 hq/test_anim.py

  secrets:
    # The repository is public: a credential that reaches it is compromised on
    # arrival. Every commit and every drain push is checked on the desktop
    # (tools/check_secrets.py), but a session can push from anywhere, so the
    # whole public history is scanned here on every push. GitHub's own push
    # protection only knows provider token shapes; gitleaks adds the generic
    # rules. Pinned and checksum-verified, like the Godot download below.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks

      - name: No credential anywhere in the history
        run: ./gitleaks git --redact --no-banner -c .gitleaks.toml .

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot

      - name: Locate binary
        run: |
          GODOT_BIN="$(find ~/godot -name 'Godot_v*_linux.x86_64' -type f | head -1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import project
        run: '"$GODOT" --headless --path . --import || true'

      - name: Every Godot source has its tracked sidecar
        run: python3 tools/check_godot_sidecars.py

      # T-17: the generator IS the test. It hard-fails on any quality assertion,
      # so a demo replay that verifies perfectly but reads as a broken farm
      # cannot ship (the T-16 spike's lesson).
      - name: Regenerate the demo replay
        run: '"$GODOT" --headless --path . --script res://tools/gen_demo_replay.gd'

      # A committed file that the generator no longer reproduces means the
      # generator ran and the commit did not include its output. "Stale replay"
      # is a silent failure otherwise: the title screen would play a farm nobody
      # can regenerate.
      - name: Demo replay is not stale
        run: git diff --exit-code assets/demo/demo_replay.json

      - name: Unit tests
        run: 'python3 tools/run_godot_test.py -- "$GODOT" --headless --path . --script res://tests/test_runner.gd'

      - name: Integration tests
        run: 'python3 tools/run_godot_test.py -- "$GODOT" --headless --path . res://tools/test_runner.tscn'

      - name: Robot session (end-to-end)
        run: 'python3 tools/run_godot_test.py -- "$GODOT" --headless --path . res://tools/robot_session.tscn'

      # Generated farms on a fixed list of seeds, played by a random but legal
      # player with saves and Continues part-way through; at every save the
      # recording must replay to that save exactly (tests/generated_games.gd).
      # Fixed seeds, so a push never goes red from luck; `-- --random=200` hunts
      # locally.
      - name: Many generated games replay exactly
        run: 'python3 tools/run_godot_test.py -- "$GODOT" --headless --path . --script res://tools/replay_many_games.gd'

      - name: Sim benchmark (smoke)
        run: 'python3 tools/run_godot_test.py -- "$GODOT" --headless --path . --script res://tools/benchmark_sim.gd'

      - name: Test process isolation and exit handling
        run: python3 tools/test_process_integrity.py

      - name: Test workbench shelf capture
        run: python3 tools/test_capture_workbench_shelf.py
