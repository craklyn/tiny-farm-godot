ter', and attach both plus the three tools/capture_boot_bloom.tscn moment"}], "conversation": [{"who": "you", "text": "Please show me an animation of the before and after attached to the results that I'll review.  The new animation will also be parameterized and viewable as a new version of the previous version, in the animation lab, right?", "at": "2026-09-19T16:28"}, {"who": "Jade", "text": "Yes to both, and I checked the repo to be sure before saying so. The boot bloom already runs entirely off tools/experiments/vfx_sunflower_bloom.py \u2014 that one script is both the Animation Lab's sunflower_bloom loop and the source the game exports from (export_anim_loop.py \u2192 assets/anim/sunflower_bloom/, which title_screen.gd draws unmodified, never re-authored). So revising it there is the whole job: same slug, same sliders, no branching between an \"old\" and \"new\" version \u2014 just this loop's frames and values changing, which is automatically what plays in the Lab the next time it's opened. Right", "at": "2026-09-19T16:30"}], "owner": "Jade", "seconds": 30, "turns": 2, "source": "work card w4b54fa114f0", "follow_ups": [{"title": "Stop the first-boot title screen from replaying the sunflower's reveal forever", "owner": "Jade", "tier": 1}]}]}, {"name": "What a harvest is worth", "items": [{"id": "Q-113", "kind": "pick", "title": "How much a player can carry before she has to sell", "question": "How much a player can carry before she has to sell", "answer": "10 on her person, 40 at the grain silo", "why": "Covers her whole starter plot \u2014 the inherited row plus what's behind it, about nine tiles \u2014 in one uninterrupted harvest-and-replant pass, so nothing in her first sitting hits the ceiling. The silo number clears a fully worked farm several times over, so it reads as room to stockpile, not a new leash. [Playtest] on both, like every number in this economy so far.", "options": [{"label": "5 on her person", "detail": "Your low suggestion. Runs out before the player can replant even the row of land the game starts her with \u2014 her first refusal would land in her first few minutes, unexplained, and it would contradict the rule (Q-11) that a tired player keeps working slowly rather than being stopped, which exists so nothing early in the game ever refuses a player who cannot yet read."}, {"label": "10 on her person, 40 at the grain silo (Recommended)", "detail": "Covers her whole starter plot \u2014 the inherited row plus what's behind it, about nine tiles \u2014 in one uninterrupted harvest-and-replant pass, so nothing in her first sitting hits the ceiling. The silo number clears a fully worked farm several times over, so it reads as room to stockpile, not a new leash. [Playtest] on both, like every number in this economy so far."}, {"label": "No cap until the grain silo exists", "detail": "Simplest to build, and it removes the friction entirely \u2014 which is also the problem. The shipping bin gets no reason to matter until a building that doesn't exist yet shows up, so the trip you wanted this change to create never happens in phase 1 at all."}], "yes_causes": "Records your pick; the seat that opened the card works it into the design that day.", "walk_back": "A ruling can be changed until it is worked in; after that it is one more ruling.", "evidence": [{"label": "How this started", "text": "You asked for the sim change where a harvested crop can be replanted as its own seed, so buying starter seed disappears from the first hour. That change needs one number it doesn't have on its own: how much can she hold before the game asks her to sell the rest. You suggested 5 or 10 for early game, on her person, growing at each storage building she gets later. This is that number, and the numbers after it. The test I sized it against: she should never stand on her own farm, seed in hand, unable to plant it, until the game has actually asked something of her in return. Her farm right now is small on purpose \u2014 the plot she inherits at the very start is a row of six tiles plus three more behind it, about nine in all, and planting itself costs her nothing (only clearing, tilling, watering and harvesting spend her day). A cap of 5 runs out before she has replanted even that first row \u2014 she'd be told no on her very first afternoon, for a reason nothing on screen explains. That repeats a problem already caught once in real play: a session logged 17 unexplained refusals out of 27 actions. A cap of 10 covers that whole starter plot in one pass. Nothing she does in her first sitting hits the ceiling. The ceiling should still exist \u2014 it's what makes the shipping bin (already in the game, rarely visited) worth a walk. It just shouldn't be the first thing she meets. For the building after it: you named a grain silo, and said it should let her \"properly arm and stock\" defensive structures \u2014 that's a phase 2/3 job the towers themselves don't have numbers for yet (Milo owns that design and it isn't written). What I can size now is the farming side: a fully worked wheat farm \u2014 replanted every cycle, nothing left fallow \u2014 tops out around 10 to 12 tiles under today's day length. A silo cap of 40 clears that more than three times over, so a bigger farm never feels the ceiling either; it only bites when she's stockpiling on purpose. Price it like the sprinkler, which is the last thing in the shop that costs gold and does no new work of its own \u2014 somewhere under its 120g, call it 80\u2013100g, [Playtest]. One thing this number can't fix on its own: today, one planted seed makes exactly one harvested crop, so a farm that replants itself produces nothing extra to sell \u2014 the carry cap would rarely have anything to bite on. That's a separate ruling (whether a planting should give back more than it cost), still unwritten, and I've filed it below so it doesn't stay dropped a second time."}, {"label": "Why now", "text": "The sim side of harvest-as-seed is queued to start f mid-sentence twice \u2014 after \"Note that if w\" and again after question 4's \"wha\". I'm answering the three questions I have in full; I'm not guessing at the missing fourth question or Daniel's aside, because guessing his own words back to him is worse than saying they didn't arrive. 1. Does harvest-as-seed make the first hour better or worse? Better, and it changes one specific moment: the first replant. Today, planting past your starting five wheat requires a shop trip \u2014 sell what you grew, then buy the same crop back with the gold. That's a mandatory currency lesson on day one, even though nothing about farming needed money to explain it. Under Daniel's model, that trip disappears: what you pick is what you plant, no shop involved, until you're holding more than you can carry. Gold only enters once there's a surplus problem worth solving. That's a stronger fit for the no-required-reading rule (S-7) than what ships today. One thing that makes this safe: the axe and pickaxe are already earned by harvest/clear counts, not gold (Q-46), so removing gold's role in day-one replanting doesn't stall tool progression \u2014 gold's only current job in the first hour is re-buying seed, which is exactly the job this proposal removes. 2. Does the pea-as-ammo role strengthen or muddle crop identity? Strengthens it, and it isn't new territory \u2014 it's the pea's original job. The code comment on the pea (Q-55) already says it exists as \"the raw material\" for \"the shooters, towers, storage and delivery economy,\" seeded early and left out of the shop on purpose so it'd arrive tested before the ammo economy needed it. Daniel's proposal is that economy showing up. The one guardrail worth naming: keep the ammo role on peas only. Wheat and tomato should stay food/gold crops \u2014 if every crop becomes a potential weapon, the roster stops telling you anything by looking at it. A clean identity: wheat and tomato are what you sell, peas are what you keep for defense. 3. Is a 5-10 carry cap the right shape of pressure, or just more walking? Right shape, with one fix. It isn't inventing a new trip \u2014 tapping the shipping bin to sell already exists (sell \u2192 shipping_bin object on the grid), so a cap doesn't add a destination, it gives that destination a reason to matter regularly instead of never. The fix: the cap should gate what's *sellable*, not what she can *carry*. Every fail-state precedent in this codebase (Q-11's energy soft floor, the no-punishing-fail-state spirit of S-7) resolves an action rather than blocking it. A cap that stops harvest cold the moment she's full breaks that pattern and would read as the farm punishing her for doing well. A cap that just says \"only what's above this line is worth gold\" costs nothing and still creates the tension Daniel's after. What this settles that wasn't asked: it's a real answer to the open half of Q-15 (the machine acquisition resource loop, still marked M3's-to-design) and it quietly answers Q-56's still-open question of how a player first meets a pea \u2014 she can grow her first one from a found seed or milestone gift and never see a shop for it. Nothing here is implemented. This is my read on Daniel's proposal, for him to rule on."}, {"label": "Files changed", "text": "{\"stat\": \"\", \"files\": [], \"applied\": false, \"why_not\": \"nothing changed\"}"}, {"label": "Checker: concerns", "text": "Milo answered the three questions that reached him honestly and with a sound recommendation (cap gates sale, not carry; ammo stays on peas), but two citations are wrong and one suggestion quietly contradicts Daniel's standing shop rule \u2014 and the brief itself arrived truncated, which is a drain defect, not Milo's."}, {"label": "The brief written for Milo", "text": "Daniel's words, verbatim: \"I recommend we change the game so it's not necessary to buy seeds for the starting plants. Rather, the plants when harvested can be planted as seeds. They can also be used as consumables (e.g. pea shooter). Only when the player acquires an excess can they be sold. Excess will be defined by game phase. Early game, the player only has storage on their person and so excess is not a large number.. 5 or 10 maybe. Later, they'll get a grain silo and other storage options that increases excess (so they can properly arm and stock their defensive structures). Note that if w"}], "conversation": [], "owner": "Milo", "seconds": 30, "turns": 0, "source": "work card wa8ea2ed3df8", "follow_ups": [{"title": "Recover the part of the brief that got cut off", "owner": "Claude", "tier": 0}, {"title": "Write the seed/ammo/surplus economy into the design doc", "owner": "Milo", "tier": 1}, {"title": "Build harvest-replants-as-seed and the excess-gated sell rule", "owner": "Tom\u00e1s", "tier": 2}]}]}, {"name": "The home's rooms", "items": [{"id": "Q-109", "kind": "pick", "title": "How much room a room gets", "question": "How much room a room gets", "answer": "Three times", "why": "A 9x6 farmhouse room and a 6x6 coop. Both are comfortably furnishable and the house lands just under the 10x7 room the player has today, so nothing about today's room gets worse. The view out under Q-108(a) is roughly one tile a side, which is where that option starts to look thin.", "options": [{"label": "Two times", "detail": "A 6x4 farmhouse room and a 4x4 coop. The bed eats a quarter of the house and the hen most of the coop; this is close to the cramped room P-18 was written to fix. What it buys is the best view out under Q-108(a) \u2014 about two outside tiles a side."}, {"label": "Three times (Recommended)", "detail": "A 9x6 farmhouse room and a 6x6 coop. Both are comfortably furnishable and the house lands just under the 10x7 room the player has today, so nothing about today's room gets worse. The view out under Q-108(a) is roughly one tile a side, which is where that option starts to look thin."}, {"label": "Four times", "detail": "A 12x8 farmhouse room and an 8x8 coop. Bigger than anything the game has content for \u2014 the rooms look empty rather than spacious in the mockups, and an empty room is a room that needs furnishing before it is worth entering. Under Q-108(a) the yard is gone entirely."}, {"label": "Per building, not one number", "detail": "Let each building carry its own multiplier: the farmhouse at three, the coop at two, a future barn at four. Nothing in P-18 requires one number for all of them, and it means a hen house never has to be as big as a home. The price is that there is no single answer to how small the view out of the window becomes, so Q-108's treatment has to hold up across the whole range."}, {"label": "Give every building the size rule already set for the farmhouse", "detail": "Make the ruling already given the rule: an interior is its footprint at half pitch, less a half-row for the roof. The coop's 2x2 becomes a 4x3 room. Consistent, needs no second number, and makes every building twice the size inside, so entering always feels the same -- but 4x3 is a small coop."}], "yes_causes": "Records your pick; the seat that opened the card works it into the design that day.", "walk_back": "A ruling can be changed until it is worked in; after that it is one more ruling.", "evidence": [{"label": "How this started", "text": "Provisionally answered for the farmhouse (CEO, 2026-09-15: 3x2 outside, 6x3 inside \u2014 six cells at half the pitch of an outdoor tile, which is three tiles by one and a half, so the room sits inside the footprint with the top half-row left for the roof). This card is what is left: whether that number holds for the coop and for everything after it. Under P-18 a building's inside is its outside multiplied by a whole number \u2014 the number has to be whole or sixteen-pixel art shimmers and the yard behind it squashes. The farmhouse is 3x2 on the farm, so it can hold a 6x4, a 9x6 or a 12x8 room. The coop is 2x2, so 4x4, 6x6 or 8x8. No room but the farmhouse's exists, so these panels are drawn rather than photographed \u2014 but every piece in them is the game's own art at the size the game draws it, which is the point: a bed is 16x32 and takes two whole tiles, a farmer's cell is 48x48. What the pictures show is how much floor is left once the things that have to be in the room are in it. For reference, her room today is 10x7 and nobody has called it cramped. The catch is that this is not only a question about floor. The same number sets how hard the farm magnifies behind the walls, so a bigger room is also a smaller view out \u2014 see the Q-108 sheet, where three times already reduces the yard to about one tile a side. If Q-108 goes to the backdrop option the two come apart and this is a free choice; if it goes to registered dilation, every step up here is paid for out of the window."}, {"label": "Why now", "text": "It is the one number in P-18 that is not forced, it sets the art budget for every interior the game ever has, and it is coupled to Q-108 \u2014 so the two want ruling together."}, {"label": "The farmhouse at the CEO's numbers: 3x2 outside, a 6x3 room nested inside it at half pitch, at both zooms.", "text": "docs/design/mockups/interiors/q108_two_zooms.png"}, {"label": "The farmhouse (3x2 outside) at two, three and four times, with her bed in it. Same zoom on every panel, so what differs is the room.", "text": "docs/design/mockups/interiors/q109_farmhouse_multipliers.png"}, {"label": "The coop (2x2 outside) at two, three and four times, with the hen in it.", "text": "docs/design/mockups/interiors/q109_coop_multipliers.png"}], "conversation": [], "owner": "the seat that opened the card", "seconds": 30, "turns": 0, "source": "decision card Q-109"}]}, {"name": "The seeder robot's animation", "items": [{"id": "wr17889769879f89", "kind": "read", "title": "Say whether the seeder bot loop is any good", "question": "Ingrid built \u201cSay whether the seeder bot loop is any good\u201d. Does it stand?", "answer": "", "why": "", "instead": "", "options": [], "yes_causes": "It closes. Nothing else starts.", "walk_back": "This is the reason it is in front of you: hard to walk back, or a matter of taste.", "evidence": [{"label": "The brief written for Ingrid", "text": "The Animation Lab drew a loop from this subject, unattended:     A 18-inch robot that drives on treads. It has a rucksack of seeds, with a carrot drawing on the side indicating it's carrot seeds.  Its upper half is a camera mounted on a stick, and a piston arm that ends in a semicircular shell as two \"fingers' that can grip something.  It is driving left to right across a field. It comes to a hole with a small mount of soil beside it, pulls a clump of seeds from the bag, scatters them in the hole, pushes the soil over to cover the hole, then drives on (repeating the animation to the next hole it comes across). It is on the Lab's page as seeder_bot \u2014 play it at true size as well as zoomed, and move its instruments to see what the numbers do. It cost $14.02 and 94 turns. What is wanted is a verdict and a reason: keep it, send it back, or drop it. The reason is the part that helps whoever picks it up, so it matters more than the verdict. If it is kept, the loop and its script still have to be landed on main; if it is sent back, say which of its parameters or beats is wrong rather than that it needs work."}], "conversation": [], "owner": "Ingrid", "seconds": 120, "turns": 0, "source": "work card wr17889769879f89", "follow_ups": []}]}, {"name": "Walking through a door", "items": [{"id": "w2b7e51c9d0af", "kind": "pick", "title": "Make going through a door one continuous move of a live world, not a cut and a zoom", "question": "How long should going through a door take, and how long is the pause before it starts?", "answer": "Take the glide down to 0.9 seconds and lengthen the pause to 0.20, then judge it on the captured strip.", "why": "She goes through doors dozens of times a day, and 1.8 seconds turns a routine step into a cutscene \u2014 but 0.6 was too short for the pause before it to read as a beat rather than a stutter.", "instead": "Keep the full 1.8 seconds if the trip through the wall is meant to feel like a small event every time, in which case only the 0.20 pause changes.", "options": [], "yes_causes": "3 pieces of work start: Set how long the door glide and the pause before it run (Jade); Find out why the tablet draws the yard at 35 frames a second (Jade); Record that the farm through the walls is one shared world view, not a second renderer (Claude) 1 of them would come back to you as a question, because they are hard to walk back.", "walk_back": "Nothing to walk back; it is a reading.", "evidence": [{"label": "What came back", "text": "Measured first, then fixed, then measured again. The harness (tools/measure_door_transition.tscn + .py) walks her through the coop's door and the farmhouse's, both ways, and records every frame: the camera, where a fence corner lands on the screen, and the picture itself. On the build you reported, the fence jumped 118 to 234 px on the swap frame and the swap frame differed from the one before by 37 to 45 levels across the whole picture; the farmhouse also slid the view for six frames after the swap. After the fix all four trips pass: the worst step in the fence's path is 1.1x its neighbour, no frame stands out from the frames around it, and the swap frame differs from the one before by 0.10 to 0.34 outside the threshold (the hut becoming the room, which is the one place the picture is meant to change). What changed: the camera now starts the door from the exact picture you were looking at (offset + eye x pitch at zoom / pitch) and glides position and zoom together to where the room's limits would rest it, landing without a hop; and the yard through the walls is the live farm, rendered by a second view sharing the same canvas, so crops, the hen, a crow and the neighbour are all there and nothing pops. Both unknowns on the card came back positive: the shared-world SubViewport works in 4.7 and the HUD does not leak into it; on the tablet (Mali-G57) the extra pass costs 2.4 ms of GPU per frame indoors and the frame rate did not drop (35.3 outdoors, 38.4 indoors). Your two asks from the evening: the glide is 1.8 s now (DOOR_ZOOM_SECONDS, marked for you to dial back), and the second of two side-by-side coops is drawn whole through the first one's wall on this build (the old backdrop painted grass over its right half; the live one cannot) - docs/design/mockups/door_transition/ has before/after strips and GIFs of the coop entry. Still parked, and still yours: ENTER_DELAY_SECONDS (0.10 -> 0.20?). One thing the profile tool made visible that is not this card's: the tablet runs the game at about 35 frames a second in the yard already. Design record: docs/design/15-interiors.md section 8a. HQ can run the door check as a job (Door transition)."}, {"label": "Test suites", "text": "unit: green, integration: green, robot_session: green, gateway: green, door_transition: green"}, {"label": "The brief written for Tom\u00e1s", "text": "Interiors (P-18, docs/design/15-interiors.md) ship: a coop and the farmhouse have rooms you walk into, the camera zooms through the door, and the farm is drawn through the walls. Two defects remain and they are the same defect seen twice. WHAT THE CEO REPORTED, 2026-09-16 \"When the zoom happens, the camera position can jump a bit. This makes things in the outer world (e.g. fences) suddenly hop to a new position and then zoom. This makes it feel like we've switched scenes and are doing a fake zoom.\" And then: \"Can we fix this? Actually draw everything correctly? Can the world actually continue to simulate and update on the periphery of the room the player is in? Can we keep the world alive through this process, so it's not just a camera trick?\" THE CORRECTION THAT MATTERS The world IS already alive. SimWorld never pauses when she goes through a door: brains tick, the hen wanders, crows arrive, crops advance at the day turn, weather rolls. This is not a simulation gap. It is a DRAWING gap -- world/farm.gd's _draw_room_backdrop is a simplified hand-written second pass (ground, boundary state, object sprite) and it does not draw crops, effects, or actors. Do not \"make the world live\"; it is live. Draw the world that is already running. DEFECT 1 -- the position jump use_door teleports her from page 0 to the room (page 2 for a coop, page 1 for the home), tens of tiles in world coordinates. The camera is a child of the player node and snaps with her (main.gd _refresh_camera_limits calls camera.reset_smoothing()). Then _zoom_through_door tweens zoom only. So the swap frame moves every world landmark to a new screen pixel, and the zoom starts after it. The maths for fixing it is exact and already in the codebase. The backdrop maps farm space into room space as room_px = offset + farm_px * pitch, where offset is Farm.room_backdrop_offset(room, building_rect). So at the instant of the swap, putting the camera at offset + camera_farm_pos * pitch with zoom / pitch shows a pixel-identical view; from there one tween of BOTH position and zoom to her new centre is continuous by construction. Watch three Godot mechanics: the camera is parented to the player so camera.position is an offset from her; position_smoothing_enabled is on at speed 8 and will fight an explicit tween; and camera.limit_* clamps continuously, so the final limits must not be applied until the tween ends. DEFECT 2 -- the content gap, which is why fixing the camera alone is not enough Even with a perfect camera, crops and actors would pop out of existence on the swap frame, because they are not in the backdrop. That would move the seam rather than remove it. THE PROPOSED MECHANISM -- verify before building on it A SubViewport sharing the main viewport's World2D, with its own Camera2D positioned over the farm. That renders the same canvas world -- crops, actors, effects, weather -- using the code that already draws them, with no parallel implementation to drift. The backdrop then becomes that live texture drawn at scale pitch with the existing offset. It is the technique used for minimaps and portals. TWO UNKNOWNS. SPIKE BOTH BEFORE WIRING ANYTHING IN.   1. Does Godot 4.7 behave as expected with SubViewport.world_2d shared and a Camera2D inside the SubViewport driving it? Confirm the farm renders, and that CanvasLayer content (the HUD) does NOT leak into it.   2. What does it cost? This draws the world twice per frame and the target is an Android tablet. Measure with tools/benchmark_sim.gd and on the device (tools/deploy_android.sh). A frame-rate regression on the tablet is not an acceptable price and the CEO has not agreed to one. If either unknown comes back negative, STOP and report. Do not improvise a fallback -- the alternative (extending the hand-written pass to re-implement autotiled soil, growth stages, the watered chip, the ripe glow and every actor draw) is a second renderer that must be kept honest forever, and that is a design decision, not an implementation one. THE VERIFICATION BAR, SET BY THE CEO He asked: \"If it's fixed, can you verify that it works as described before showing it to me again?\" The answer given was yes, by measurement rather than by eye. Build the harness FIRST and baseline the CURRENT build with it, so there is a failing measurement before there is a fix:   a. Per frame through a transition, log camera global position and zoom, and compute where a fixed world landmark (pick a fence corner at a known farm tile) lands on screen. Assert that screen path has no frame-to-frame discontinuity.   b. Capture every frame and diff consecutive pairs. A smooth zoom gives a small steadily-changing difference; a jump or a content pop gives a spike. This is the stronger test because it catches causes nobody enumerated. Do not show him anything until the spike in (b) is gone. tools/capture_coop_inside.tscn and tools/capture_interior_plate.tscn are the existing capture harnesses to build from. ALSO PARKED, SMALLER, HIS WORDS: \"let's plan to come back to the stutter in a second\" ui/menus.gd ENTER_DELAY_SECONDS is 0.10 -- the beat between the structure panel closing and the door transition starting. He confirmed the stutter is real but the current value may be too short against a 0.60s zoom. 0.20 is the obvious next try. It is marked [Playtest]. Do this one only after the above, and only with his word on the value. HOUSE RULES THAT BIT THIS FEATURE ALREADY   - A passing unit test on a gateway verb says nothing about whether the player can reach it. A room's doorway was a tile state and SPECIAL_OBJECTS is keyed on objects, so the verb worked and the tap did not; the CEO found it in play. Anything reached by tapping gets a test that starts at InputManager, in tools/test_runner.tscn. Scenario AX is the pattern.   - Both suites green on every commit, plus the robot session and tools/check_gateway.py.   - Another Claude session shares this working tree. Commit only your own files.   - Run Godot with XDG_DATA_HOME pointed at a scratch dir, or two sessions fight over user:// and the integration suite hangs. FILES   world/farm.gd            _draw_room_backdrop, room_backdrop_offset, _backdrop_active/_backdrop_rect   main.gd                  _zoom_through_door, _refresh_camera_limits, _limit_to_room, DOOR_ZOOM_SECONDS   systems/sim/sim_world.gd rooms registry, room_building_rect, world_pos_of_cell, room_exit_for   docs/design/15-interiors.md   the whole design, and section 9 for what is and is not built"}], "conversation": [], "owner": "Tom\u00e1s", "seconds": 30, "turns": 0, "source": "work card w2b7e51c9d0af", "follow_ups": [{"title": "Set how long the door glide and the pause before it run", "owner": "Jade", "tier": 2}, {"title": "Find out why the tablet draws the yard at 35 frames a second", "owner": "Jade", "tier": 0}, {"title": "Record that the farm through the walls is one shared world view, not a second renderer", "owner": "Claude", "tier": 1}]}]}, {"name": "The store page", "items": [{"id": "wadf051cd6c7", "kind": "pick", "title": "Rewrite the store page to match what the game now does", "question": "Put the new store page text live now, or hold it until the next release tag goes out?", "answer": "Hold it, and ship the page and the build together on the tag.", "why": "Anyone who clicks play today gets the older build, so publishing now promises a shop and a robot that are not there \u2014 the same failure as the old page, pointed the other way.", "instead": "Publish now, on the grounds that the page is wrong either way and no date is set for the tag \u2014 which is defensible if the tag slips much further.", "options": [], "yes_causes": "4 pieces of work start: Stop a release tag when the store page is older than what it ships (Lena); The Marketing page quotes store copy that no longer exists and shows a verdict from a deleted goal (Rin); Three features in the release manifest describe things a player cannot do (Victor); The store page has no screenshots (Tessa) 1 of them would come back to you as a question, because they are hard to walk back.", "walk_back": "One git revert.", "evidence": [{"label": "What came back", "text": "The store page now describes the game as it actually plays, and the wordless promise says the thing that is true. What the page says now. It opens on a small farming game you play with one finger, walks through the loop \u2014 clear, till, plant, water, sleep \u2014 and then leads with what is new: you sell the harvest and buy the things that do the work instead, a sprinkler that waters its patch every morning and a robot you teach by pointing at the tiles you want done. The clock is there (six in the morning to four in the afternoon), and the bed that glows when the light goes. It closes on the arc: first machines, then defences, then robots you train yourself. The accessibility claim. \"A child who cannot read can farm.\" Walking, clearing, planting, watering, harvesting and shopping are pictures, coins and numbers; the one screen with words in it is the panel for setting a robot going, and the page says so plainly \u2014 an adult starts the robot, the farming stays wordless. That is exactly what the build does, and it stops the page making a promise about a game whose later phases are meant to need words. Three things I found while checking the copy against the build, which you should know. The release manifest on the Sales page overstates three of its thirteen features, and I left all three off the page. The home is a debug screen with nothing in the live game leading to it \u2014 \"the farmhouse opens\" is not true for a player. The stuck-machine notice is a planned project, one step of five done. And the shop sells seeds and machines only, not \"tools, animals and machines\" \u2014 tools are picked up at the gates and no animal is for sale. The manifest is a good candidate list; it is not the build. The page was offering an Android download that does not exist. The release workflow publishes the browser build and nothing else, and the only APK this studio makes is a debug build for one tablet \u2014 a signed release needs a keystore nobody has made. I removed the download claim and wrote down why, so it does not come back. Your Marketing page still quotes the sentence I just deleted. It opens with \"There are no menus to learn and no words to read\", cited to the live store page, under a verdict reading \"Nothing in the build asks a player to read\" \u2014 and that verdict comes from a goal that was removed some time ago, so the page is printing a green result from nothing. It was already wrong before today; my rewrite makes the quote wrong too. Filed for Rin. The one call that is yours. The page now describes the build in the repo, and what is live on itch is still the older release. Recommendation and items below."}, {"label": "Files changed", "text": "{\"stat\": \"ITCH_PAGE.md                 | 64 ++++++++++++++++++++++++++++++++------------\\n hq/data/goals/marketing.json |  7 +++--\\n 2 files changed, 50 insertions(+), 21 deletions(-)\", \"files\": [\"ITCH_PAGE.md\", \"hq/data/goals/marketing.json\"], \"applied\": true, \"why_not\": \"\"}"}, {"label": "Test suites", "text": "unit: green, integration: green"}, {"label": "Checker: concerns", "text": "nobody checked this \u2014 the check call did not come back"}, {"label": "The brief written for Carmen", "text": "The store page describes the game as it was at v0.1.0 and promises 'no menus to learn and no words to read'. That promise is S-7's, and S-7 binds phase 1's core farming loop only \u2014 the arc runs to programmable bots that will need words by design, so the build gaining text is not a broken promise, it is the plan. Rewrite the page against what the game now does (the shop, the robots, the home, the clock \u2014 see the release manifest on the Sales page), and phrase the accessibility claim so it says what is actually true: a child who cannot read can farm."}], "conversation": [], "owner": "Carmen", "seconds": 30, "turns": 0, "source": "work card wadf051cd6c7", "follow_ups": [{"title": "Stop a release tag when the store page is older than what it ships", "owner": "Lena", "tier": 1}, {"title": "The Marketing page quotes store copy that no longer exists and shows a verdict from a deleted goal", "owner": "Rin", "tier": 1}, {"title": "Three features in the release manifest describe things a player cannot do", "owner": "Victor", "tier": 1}, {"title": "The store page has no screenshots", "owner": "Tessa", "tier": 2}]}]}, {"name": "HQ itself", "items": [{"id": "w3e5997f5065", "kind": "pick", "title": "A project can be deferred by a ruling without reading as stuck", "question": "Should work that is waiting on an event you scheduled still count as blocked?", "answer": "No \u2014 rule for the third status, with the event that wakes it recorded and watched.", "why": "Until it lands, your dashboard's top line tells you to do the thing you ruled should not be done yet, and the Product pillar goes amber on 8 September for a wait you ordered.", "instead": "Keep one blocked status and snooze the two projects until a date \u2014 half the work, but blocked keeps meaning two different things and somebody has to re-pick the date every time it lapses.", "options": [], "yes_causes": "3 pieces of work start: Teach HQ the waiting status (Claude); Re-tag the parked projects and sweep the rest (Sofia); Decide how a wait reads on the dashboard and the program page (Rin)", "walk_back": "This is the reason it is in front of you: hard to walk back, or a matter of taste.", "evidence": [{"label": "What came back", "text": "Read every place HQ tests status == \"blocked\", then wrote the ruling and the spec behind it. What I found. The 2 September playtesting ruling parked two projects on one event \u2014 the green-tester sitting before the next public release scores the last onboarding bar *and* produces the human session the replay-verification work needs. HQ has no status for that, so the two ends of the same wait wear opposite wrong labels: the replay project says blocked, the onboarding-gate project says planned. blocked is the expensive one. Every blocked project's unblock sentence becomes an entry in your dashboard queue, so before I filed this, the first line on your dashboard read *\"record one never-before-played tester's first unguided session\u2026\"* \u2014 an instruction to go do the thing you ruled should not happen yet. Its blocked-since date also feeds the \"nothing stuck over a week\" check, which turns Product amber on 8 September for a wait you ordered. If a *release-critical* project were parked this way it would also enter the release train's risk list and false-alarm Player Update 1. planned is the quieter error: it reads as ready to start and hides the wait completely. What I changed. A decision card for you, and the drafted semantics behind it in the designer queue: a fifth project status, deferred, carrying the decision that chose the wait, the event that ends it, and \u2014 the part that earns it \u2014 that event bound to something HQ can watch on its own, so a wait that outlives its trigger becomes a fire instead of a quiet row. Deferred work leaves your queue and the stuck clock but keeps its row on the program report reading *waits for the next public release*. The queue entry spells out all five rules and every place in the code that changes. Your dashboard's top line is now the card itself. I did not re-tag the two projects or touch the dashboard code \u2014 whether a scheduled wait gets to leave your queue is the thing being ruled, and doing it first would decide it."}, {"label": "Files changed", "text": "{\"stat\": \"docs/DESIGNER_QUEUE.md      | 57 +++++++++++++++++++++++++++++++++++++++++++++\\n hq/data/decisions/Q-90.json | 30 ++++++++++++++++++++++++\\n 2 files changed, 87 insertions(+)\", \"files\": [\"docs/DESIGNER_QUEUE.md\", \"hq/data/decisions/Q-90.json\"], \"applied\": true, \"why_not\": \"\"}"}, {"label": "Checker: concerns", "text": "Sofia did exactly the asked step \u2014 the deferred-status semantics are drafted in the queue and a clean decision card is on the inbox, with every code claim (Eye of Sauron entry, blocked-too-long clock, release-train gating set) checked out true \u2014 but the amber date she gives you is one day early."}, {"label": "The brief written for Sofia", "text": "The program owner found, working replay-phase-b, that HQ has no way to distinguish a project waiting on a scheduled event by the CES ruling from one that is genuinely stuck. replay-phase-b is deferred by the 2026-09-02 no-fresh-recruiting ruling until the next release nears \u2014 nothing impedes it \u2014 yet status blocked reads as five-alarm trouble and (were it critical) would false-alarm the release train. Proposal: a status like deferred that carries its wake trigger, counts as neither fire nor a routeless blocker, but stays visible with its trigg
