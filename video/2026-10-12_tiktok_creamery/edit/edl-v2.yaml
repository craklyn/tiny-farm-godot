# "feature" (cuts at the loudness dips, 18.59 / 19.13, and 19.62 / 20.10, leaving a short beat before "The
# creamery"); "ultimately being made into products such as cheese" is cut (it repeats the next line), ending
# that segment after "pipeline" at 60.22 (medium.en hears "ultimately" from 60.15; a cut at 60.45 left "ul-"); and the pause inside "Leave your comments … where they go" is cut
